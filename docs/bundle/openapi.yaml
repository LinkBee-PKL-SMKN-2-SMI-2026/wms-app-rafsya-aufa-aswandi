openapi: 3.1.0
info:
  title: Activity Logs API
  version: 1.0.0
  description: Audit and user activity logging endpoints
servers:
  - url: http://localhost:3000/api
    description: Local development
tags:
  - name: Activity Logs
    x-displayName: Activity Logs
  - name: Auth
    x-displayName: Auth
  - name: Categories
    x-displayName: Categories
  - name: Dashboard
    x-displayName: Dashboard
  - name: Example
    x-displayName: Example
  - name: Locations
    x-displayName: Locations
  - name: Products
    x-displayName: Products
  - name: Reports
    x-displayName: Reports
  - name: Stock Movements
    x-displayName: Stock Movements
paths:
  /activity-logs:
    get:
      summary: Get audit activity logs
      tags:
        - Activity Logs
      security:
        - Activity_Logs_API_bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: entity
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activity logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Activity_Logs_API_ActivityLogPaginatedResponse
  /auth/register:
    post:
      summary: Register new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_API_RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Auth_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Auth_API_UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_API_ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_API_ErrorResponse'
  /auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_API_LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Auth_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Auth_API_LoginResponseData'
        '400':
          description: Invalid input or credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_API_ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_API_ErrorResponse'
  /auth/me:
    get:
      summary: Get logged-in user profile
      tags:
        - Auth
      security:
        - Auth_API_bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Auth_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Auth_API_UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_API_ErrorResponse'
  /categories:
    get:
      summary: Get all categories
      tags:
        - Categories
      security:
        - Categories_API_bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_API_CategoryPaginatedResponse'
    post:
      summary: Create a category (Admin only)
      tags:
        - Categories
      security:
        - Categories_API_bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categories_API_CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Categories_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Categories_API_Category'
        '409':
          description: Category name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_API_ErrorResponse'
  /categories/{id}:
    get:
      summary: Get category by ID
      tags:
        - Categories
      security:
        - Categories_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Categories_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Categories_API_Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_API_ErrorResponse'
    put:
      summary: Update category (Admin only)
      tags:
        - Categories
      security:
        - Categories_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categories_API_UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Categories_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Categories_API_Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_API_ErrorResponse'
    delete:
      summary: Delete category (Admin only)
      tags:
        - Categories
      security:
        - Categories_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Categories_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Categories_API_Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_API_ErrorResponse'
  /dashboard/stats:
    get:
      summary: Get overview dashboard statistics
      tags:
        - Dashboard
      security:
        - Dashboard_Stats_API_bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Dashboard_Stats_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: >-
                          #/components/schemas/Dashboard_Stats_API_DashboardStats
  /dashboard/recent-movements:
    get:
      summary: Get recent stock movements for dashboard
      tags:
        - Dashboard
      security:
        - Dashboard_Stats_API_bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Recent movements retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Dashboard_Stats_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: >-
                            #/components/schemas/Dashboard_Stats_API_RecentMovementItem
  /example:
    get:
      summary: Get all examples
      description: Retrieve paginated examples with search, filter, and sort
      tags:
        - Example
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Items per page (default 10, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          required: false
          description: Search by name (case-insensitive)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort by name
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: isActive
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
      responses:
        '200':
          description: Examples retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ApiPaginatedResponse'
    post:
      summary: Create a new example
      tags:
        - Example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Example_API_CreateExampleRequest'
      responses:
        '201':
          description: Example created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Example_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Example_API_Example'
        '409':
          description: Example name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
  /example/bulk:
    post:
      summary: Bulk create examples
      description: >-
        Create multiple examples at once. Each item is processed individually —
        successful ones return in `data`, failures in `failed`.
      tags:
        - Example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Example_API_BulkCreateRequest'
      responses:
        '201':
          description: Bulk create completed (partial success possible)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Example_API_Example'
                  failed:
                    type: array
                    items:
                      $ref: '#/components/schemas/Example_API_BulkCreateFailedItem'
  /example/with-items:
    post:
      summary: Create example with nested items
      tags:
        - Example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Example_API_CreateWithItemsRequest'
      responses:
        '201':
          description: Example with items created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Example_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: >-
                          #/components/schemas/Example_API_CreateWithItemsResponse
        '400':
          description: Duplicate product names in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
        '409':
          description: Example name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
  /example/{id}:
    get:
      summary: Get example by ID
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Example retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Example_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Example_API_ExampleWithItems'
        '404':
          description: Example not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
    put:
      summary: Full update an example
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Example_API_UpdateExampleRequest'
      responses:
        '200':
          description: Example updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Example_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Example_API_Example'
        '404':
          description: Example not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
        '409':
          description: Name conflicts with another record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
    patch:
      summary: Partial update an example
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Example_API_PartialUpdateExampleRequest'
      responses:
        '200':
          description: Example partially updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Example_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Example_API_Example'
        '400':
          description: No fields provided for update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
        '404':
          description: Example not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
        '409':
          description: Name conflicts with another record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
    delete:
      summary: Delete an example
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Example deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Example_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Example_API_Example'
        '404':
          description: Example not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example_API_ErrorResponse'
  /locations:
    get:
      summary: Get all locations
      tags:
        - Locations
      security:
        - Locations_API_bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Locations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations_API_LocationPaginatedResponse'
    post:
      summary: Create location (Admin only)
      tags:
        - Locations
      security:
        - Locations_API_bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Locations_API_CreateLocationRequest'
      responses:
        '201':
          description: Location created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Locations_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Locations_API_Location'
        '409':
          description: Location code or name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations_API_ErrorResponse'
  /locations/{id}:
    get:
      summary: Get location by ID
      tags:
        - Locations
      security:
        - Locations_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Location retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Locations_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Locations_API_Location'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations_API_ErrorResponse'
    put:
      summary: Update location (Admin only)
      tags:
        - Locations
      security:
        - Locations_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Locations_API_UpdateLocationRequest'
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Locations_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Locations_API_Location'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations_API_ErrorResponse'
    delete:
      summary: Delete location (Admin only)
      tags:
        - Locations
      security:
        - Locations_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Location deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Locations_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Locations_API_Location'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations_API_ErrorResponse'
  /products:
    get:
      summary: Get all products
      tags:
        - Products
      security:
        - Products_API_bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products_API_ProductPaginatedResponse'
    post:
      summary: Create a product (Admin only)
      tags:
        - Products
      security:
        - Products_API_bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Products_API_CreateProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Products_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Products_API_Product'
        '409':
          description: Product SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products_API_ErrorResponse'
  /products/{id}:
    get:
      summary: Get product by ID
      tags:
        - Products
      security:
        - Products_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Products_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Products_API_Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products_API_ErrorResponse'
    put:
      summary: Update product (Admin only)
      tags:
        - Products
      security:
        - Products_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Products_API_UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Products_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Products_API_Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products_API_ErrorResponse'
    delete:
      summary: Delete product (Admin only)
      tags:
        - Products
      security:
        - Products_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Products_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Products_API_Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products_API_ErrorResponse'
  /products/{id}/stock:
    get:
      summary: Get product stock balance
      tags:
        - Products
      security:
        - Products_API_bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product stock retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Products_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Products_API_ProductStock'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products_API_ErrorResponse'
  /reports/summary:
    get:
      summary: Get inventory summary report
      tags:
        - Reports
      security:
        - Reports_API_bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
