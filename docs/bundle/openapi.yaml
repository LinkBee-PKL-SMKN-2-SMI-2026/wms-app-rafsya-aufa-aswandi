                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Reports_API_InventorySummary'
  /reports/low-stock:
    get:
      summary: Get low-stock alerts
      tags:
        - Reports
      security:
        - Reports_API_bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Low-stock report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reports_API_LowStockPaginatedResponse'
  /movements/inbound:
    post:
      summary: Record inbound stock movement
      tags:
        - Stock Movements
      security:
        - Stock_Movements_API_bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stock_Movements_API_CreateMovementRequest'
      responses:
        '201':
          description: Inbound movement recorded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Stock_Movements_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Stock_Movements_API_StockMovement'
        '400':
          description: Bad request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock_Movements_API_ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock_Movements_API_ErrorResponse'
  /movements/outbound:
    post:
      summary: Record outbound stock movement
      tags:
        - Stock Movements
      security:
        - Stock_Movements_API_bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stock_Movements_API_CreateMovementRequest'
      responses:
        '201':
          description: Outbound movement recorded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Stock_Movements_API_ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Stock_Movements_API_StockMovement'
        '400':
          description: Insufficient stock or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock_Movements_API_ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock_Movements_API_ErrorResponse'
  /movements/history:
    get:
      summary: Get stock movement history
      tags:
        - Stock Movements
      security:
        - Stock_Movements_API_bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - INBOUND
              - OUTBOUND
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Movement history retrieved successfully
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Stock_Movements_API_MovementPaginatedResponse
