openapi: 3.1.0
info:
  title: Dashboard Stats API
  version: 1.0.0
  description: Dashboard statistics and overview data
servers:
  - url: http://localhost:3000/api
    description: Local development

paths:
  /dashboard/stats:
    get:
      summary: Get overview dashboard statistics
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-movements:
    get:
      summary: Get recent stock movements for dashboard
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent movements retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RecentMovementItem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Payload
      required:
        - success
        - message

    DashboardStats:
      type: object
      properties:
        totalProducts:
          type: integer
        totalCategories:
          type: integer
        totalLocations:
          type: integer
        totalStock:
          type: integer
        lowStockAlertCount:
          type: integer
        totalInboundMovements:
          type: integer
        totalOutboundMovements:
          type: integer
      required:
        - totalProducts
        - totalCategories
        - totalLocations
        - totalStock
        - lowStockAlertCount

    RecentMovementItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [INBOUND, OUTBOUND]
        quantity:
          type: integer
        productName:
          type: string
        userEmail:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - quantity
        - createdAt