openapi: 3.1.0
info:
  title: Reports API
  version: 1.0.0
  description: Inventory reports and alert endpoints
servers:
  - url: http://localhost:3000/api
    description: Local development

paths:
  /reports/summary:
    get:
      summary: Get inventory summary report
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Summary report retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InventorySummary"

  /reports/low-stock:
    get:
      summary: Get low-stock alerts
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Low-stock report retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowStockPaginatedResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Payload
      required:
        - success
        - message

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages

    InventorySummary:
      type: object
      properties:
        totalProducts:
          type: integer
        totalStock:
          type: integer
        totalLowStock:
          type: integer
        totalCategories:
          type: integer
        totalLocations:
          type: integer
      required:
        - totalProducts
        - totalStock
        - totalLowStock
        - totalCategories
        - totalLocations

    LowStockItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        stock:
          type: integer
        minimumStock:
          type: integer
        categoryName:
          type: string
        locationName:
          type: string
      required:
        - id
        - name
        - sku
        - stock
        - minimumStock

    LowStockPaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/LowStockItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - success
        - message
        - data
        - pagination